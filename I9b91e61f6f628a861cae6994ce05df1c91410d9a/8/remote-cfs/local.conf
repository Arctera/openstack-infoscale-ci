[[local|localrc]]
ADMIN_PASSWORD=secret
DATABASE_PASSWORD=$ADMIN_PASSWORD
RABBIT_PASSWORD=$ADMIN_PASSWORD
SERVICE_PASSWORD=$ADMIN_PASSWORD
SERVICE_TOKEN=$ADMIN_PASSWORD
MYSQL_PASSWORD=$ADMIN_PASSWORD
RECLONE=yes

CINDER_REPO=https://review.opendev.org/openstack/cinder
CINDER_BRANCH=refs/changes/72/986072/8

NOVA_REPO=https://github.com/csg-infoscale/openstack-nova.git
NOVA_BRANCH=feature/infoscale-support

LIBS_FROM_GIT=os-brick
OS_BRICK_REPO=https://github.com/csg-infoscale/openstack-osbrick.git
OS_BRICK_BRANCH=feature/infoscale-support

# Enable Neutron
IP_VERSION=4
HOST_IP=10.210.183.24

# Disable security groups entirely
#Q_USE_SECGROUP=False
LIBVIRT_FIREWALL_DRIVER=nova.virt.firewall.NoopFirewallDriver
CINDER_SECURE_DELETE=False

# Leave the host firewall as it is. Otherwise devstack disables firewalld and
# starts the iptables service, whose default rules reject every inbound
# connection except SSH, including NFS from the other cluster node.
FORCE_FIREWALLD=True

# These options define  expected driver capabilities
TEMPEST_VOLUME_DRIVER=infoscale
TEMPEST_VOLUME_VENDOR="InfoScale"
TEMPEST_STORAGE_PROTOCOL=infoscale
TEMPEST_VOLUME_MANAGE_SNAPSHOT=false
TEMPEST_VOLUME_MANAGE_VOLUME=false
ATTACH_ENCRYPTED_VOLUME_AVAILABLE=false

[[post-config|$CINDER_CONF]]
[DEFAULT]
default_volume_type = infoscale-sgclass0
storage_availability_zone = openstack
enabled_backends = infoscale-1
log_dir = /opt/stack/logs
log_color = False
logging_exception_prefix = ERROR %(name)s %(instance)s
logging_default_format_string = %(levelname)s %(name)s [-] %(instance)s%(message)s
logging_context_format_string = %(levelname)s %(name)s [%(global_request_id)s %(request_id)s %(project_name)s %(user_name)s] %(instance)s%(message)s
logging_debug_format_suffix = {{(pid=%(process)d) %(funcName)s %(pathname)s:%(lineno)d}}

[infoscale-1]
volume_driver = cinder.volume.drivers.infoscale.InfoScaleCinderDriver
backend_availability_zone = openstack
volume_backend_name = infoscale
infoscale_mount_point_base = /cinderhost
infoscale_rest_host = rest.infoscale-cinderaz2
infoscale_rest_port = 5637
infoscale_nfs_export_enabled = True
driver_client_cert = /opt/stack/cinder-cert/cinder.crt
driver_client_cert_key = /opt/stack/cinder-cert/cinder.key
driver_ssl_cert_verify = False

[[post-config|$NOVA_CONF]]
[DEFAULT]
log_dir = /opt/stack/logs
log_file = nova-schedular.log
log_color = False
logging_exception_prefix = ERROR %(name)s %(instance)s
logging_default_format_string = %(levelname)s %(name)s [-] %(instance)s%(message)s
logging_context_format_string = %(levelname)s %(name)s [%(global_request_id)s %(request_id)s %(project_name)s %(user_name)s] %(instance)s%(message)s
logging_debug_format_suffix = {{(pid=%(process)d) %(funcName)s %(pathname)s:%(lineno)d}}

[[post-config|$NOVA_CPU_CONF]]
[DEFAULT]
log_dir = /opt/stack/logs
log_file = nova-compute.log
log_color = False
logging_exception_prefix = ERROR %(name)s %(instance)s
logging_default_format_string = %(levelname)s %(name)s [-] %(instance)s%(message)s
logging_context_format_string = %(levelname)s %(name)s [%(global_request_id)s %(request_id)s %(project_name)s %(user_name)s] %(instance)s%(message)s
logging_debug_format_suffix = {{(pid=%(process)d) %(funcName)s %(pathname)s:%(lineno)d}}
